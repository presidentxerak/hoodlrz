  // Petit trait "main" jittere (pour le decor : briques, drips...).
  function jline(ctx, x0, y0, x1, y1, w, seed, boil) {
    const j = (s) => (h2(seed + s, boil) - 0.5) * 4;
    ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x0 + j(1), y0 + j(2));
    ctx.quadraticCurveTo((x0 + x1) / 2 + j(3), (y0 + y1) / 2 + j(4), x1 + j(5), y1 + j(6));

  // Polyligne "faite main" (jitter par sommet + leger tremblé) pour les decors.
  function jpoly(ctx, pts, w, seed, boil, close) {

    ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(pts[0].x + j(1), pts[0].y + j(2));

  /* --------------------- Utilitaires de trait "encre" ------------------- */
  // Applique un decalage normal (boil) a une polyligne de base.
  function boilPts(base, amp, seed, boil, tangJit) {
    const n = base.length, out = new Array(n);
    for (let i = 0; i < n; i++) {
      const p = base[i];
      const a = base[Math.max(0, i - 1)], b = base[Math.min(n - 1, i + 1)];
      let dx = b.x - a.x, dy = b.y - a.y;
      const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
      const nx = -dy, ny = dx;                          // normale
      const jn = (h2(seed + i * 131, boil) - 0.5) * 2 * amp;
      const jt = (h2(seed + i * 977, boil + 7) - 0.5) * 2 * (tangJit || amp * 0.4);
      out[i] = { x: p.x + nx * jn + dx * jt, y: p.y + ny * jn + dy * jt };
    }
    return out;
  }
  // Trace une polyligne lissee (quadratiques par les milieux) -> ligne d'encre.
  function tracePath(ctx, pts, close) {
    if (pts.length < 2) return;
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i].x + pts[i + 1].x) / 2, my = (pts[i].y + pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
    }
    const n = pts.length - 1;
    ctx.lineTo(pts[n].x, pts[n].y);
    if (close) ctx.closePath();
  }
  // Trait d'encre ouvert, avec double passe optionnelle (rendu marker epais).
  function ink(ctx, base, opt) {
    const o = opt || {};
    const amp = o.amp == null ? 3 : o.amp;
    const w = o.w == null ? 8 : o.w;
    const col = o.color || INK;
    const passes = o.doubled ? 2 : 1;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (let k = 0; k < passes; k++) {
      const pts = boilPts(base, amp, (o.seed | 0) + k * 313, (o.boil | 0) + k * 5, o.tang);
      ctx.beginPath(); tracePath(ctx, pts, o.close);
      ctx.strokeStyle = col;
      ctx.lineWidth = w * (k === 1 ? 0.72 : 1);
      ctx.stroke();
    }
  }
  // Forme fermee remplie + contour d'encre.
  function inkFill(ctx, base, opt) {
    const o = opt || {};
    const pts = boilPts(base, o.amp == null ? 3 : o.amp, o.seed | 0, o.boil | 0, o.tang);
    ctx.beginPath(); tracePath(ctx, pts, true);
    if (o.fill) { ctx.fillStyle = o.fill; ctx.fill(); }
    if (o.w) { ctx.strokeStyle = o.color || INK; ctx.lineWidth = o.w; ctx.lineJoin = 'round'; ctx.stroke(); }
    return pts;
  }
  // Cercle "dessine main" (polygone boilant).
  function circlePts(cx, cy, r, k) {
    k = k || 22; const a = [];
    for (let i = 0; i <= k; i++) { const t = (i / k) * Math.PI * 2; a.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r }); }
    return a;
  }
  // Arc de points (pour bouches / sourcils).
  function arcPts(cx, cy, r, a0, a1, k) {
    k = k || 14; const a = [];
    for (let i = 0; i <= k; i++) { const t = a0 + (a1 - a0) * (i / k); a.push({ x: cx + Math.cos(t) * r, y: cy + Math.sin(t) * r }); }
    return a;
  }

  /* ------------------------- Lettrage "scrawl" -------------------------- */
  // Caps grasses jitterees glyphe par glyphe -> faux lettrage main (2 passes).
  function scrawl(ctx, text, x, y, size, color, seed, boil, align) {
    ctx.save();
    // Typo Hoodlrz embarquee (fallback si pas encore chargee). Deja manuscrite
    // => on reduit le jitter pour ne pas la denaturer.
    ctx.font = size + "px 'Hoodlrz', 'Arial Black', Impact, system-ui, sans-serif";
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    const widths = []; let total = 0;
    for (const ch of text) { const w = ctx.measureText(ch).width * 0.98 + size * 0.05; widths.push(w); total += w; }
    let cx = align === 'center' ? x - total / 2 : align === 'right' ? x - total : x;
    let idx = 0;
    for (const ch of text) {
      const rot = (h2(seed + idx * 71, boil) - 0.5) * 0.10;
      const dy = (h2(seed + idx * 53, boil + 3) - 0.5) * size * 0.08;
      const sc = 0.96 + h2(seed + idx * 37, boil + 9) * 0.10;
      ctx.save();
      ctx.translate(cx + widths[idx] / 2, y + dy);
      ctx.rotate(rot); ctx.scale(1, sc);
      // contour sombre -> lisibilite du texte (blanc inclus) sur mur + equalizer
      ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.62)';
      ctx.lineWidth = size * 0.2; ctx.strokeText(ch, -widths[idx] / 2, 0);
      // corps couleur, double passe legerement decalee (marker)
      ctx.fillStyle = color;
      ctx.fillText(ch, -widths[idx] / 2, 0);
      ctx.fillText(ch, -widths[idx] / 2 + size * 0.02, size * 0.02);
      ctx.restore();
      cx += widths[idx]; idx++;
    }
    ctx.restore();
  }

  /* ---------------------------- Yeux ------------------------------------ */
  function drawEye(ctx, x, y, s, style, side, seed, boil, blink, ow) {

    // et equalizer dans la meme teinte, hoodie blanc) => pieces plus graphiques.
    if (rng() < 0.55) {
      const accent = pick(rng, NEON);
      T.mono = accent;
      T.hatColor = accent; T.bottomColor = accent; T.eqColor = accent; T.bgAccent = accent;
      T.hoodColor = rng() < 0.7 ? '#ffffff' : accent;   // hoodie surtout blanc
    }
    // Une expression FIXE par generation => un seul personnage par token (deterministe).
    T.exprIndex = (rng() * EXPRESSIONS.length) | 0;
    // Flux RNG dedie aux citations : la sequence de taps d'un token est reproductible.
    T.qrng = mulberry32(seed ^ 0x9e3779b9);
    T.quoteIndex = (T.qrng() * QUOTES.length) | 0;
    T.pressAt = -1e9;                    // horodatage du dernier tap (ms), pour le rebond
    T.blinkSeed = (rng() * 1e6) | 0;
    return T;
  }

  // Tap : nouvelle citation + rebond + audio. Le personnage (visage, chapeau, decor)
  // reste IDENTIQUE => un seul personnage par generation.
  function advance(token, nowMs) {
    let q = (token.qrng() * QUOTES.length) | 0;
    if (q === token.quoteIndex) q = (q + 1) % QUOTES.length; // evite la repetition immediate
    token.quoteIndex = q;
    token.pressAt = (nowMs == null ? 0 : nowMs);
    return { quote: QUOTES[token.quoteIndex] };
  }

  /* ============= DECORS GENERATIFS (au TRAIT, couleur du hoodie) ==========
     Tous les decors sont des dessins au trait : couleur = outline du hoodie
     (col), epaisseur = moitie de celle du hoodie (dw). Ils restent en retrait
     grace a une opacite reduite, pour ne pas rivaliser avec le personnage. */
  function sceneBricks(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const seed = T.seed | 0, boil = f.boil, rw = S / 3.4, rh = S * 0.14;
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 0.4;
    let row = 0;
    for (let y = -rh; y < S + rh; y += rh, row++) {
      const off = h2(seed + row * 17, 1) * rw;
      jline(ctx, -12, y, S + 12, y, dw, seed + row * 17, boil);
      for (let x = off; x < S + rw; x += rw) jline(ctx, x, y, x, y + rh, dw, seed + row * 131 + (x | 0), boil);
    }
    ctx.globalAlpha = 1;
  }

  // ---- CITE : immeubles REMPLIS noir (occlusion propre) + fenetres, en clusters
  // qui cadrent le visage, ciel degage avec lune + etoiles.
  function cityBld(ctx, S, dw, boil, f, col, bx, by, w, alpha, dens, sd) {
    const h = S - by + 4;
    ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(bx - 3, by, w + 6, h);          // occlusion pleine
    ctx.globalAlpha = alpha; ctx.strokeStyle = col;
    jpoly(ctx, [{ x: bx, y: S + 4 }, { x: bx, y: by }, { x: bx + w, y: by }, { x: bx + w, y: S + 4 }], dw, sd, boil, false); // profil (cotes + toit)
    const r = h2(sd, 9);
    if (r < 0.4) jline(ctx, bx + w * 0.5, by, bx + w * 0.5, by - S * 0.05, dw, sd + 1, boil);              // antenne
    else if (r < 0.7) { ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(bx + w * 0.28, by - S * 0.045, w * 0.44, S * 0.045); ctx.globalAlpha = alpha; jrect(ctx, bx + w * 0.28, by - S * 0.045, w * 0.44, S * 0.045, dw, sd + 2, boil); } // chateau d'eau
    const cols = Math.max(2, Math.round(w / (S * 0.04))), rows = Math.floor(h / (S * 0.06));
    ctx.fillStyle = col;
    for (let r2 = 0; r2 < rows; r2++) for (let ci = 0; ci < cols; ci++) {
      if (h2(sd + r2 * 13 + ci * 5, 3) > dens) continue;
      const ww = w * 0.72 / cols * 0.58, wx = bx + w * 0.14 + ci * (w * 0.72 / cols), wy = by + S * 0.03 + r2 * S * 0.06;
      const lit = h2(sd + r2 * 31 + ci * 7, 4);
      ctx.globalAlpha = lit < 0.5 ? (0.55 + 0.35 * (0.5 + 0.5 * Math.sin(f.t * 2 + ci + r2))) : 0.14;
      ctx.fillRect(wx, wy, ww, S * 0.03);
    }
  }
  function sceneCity(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const seed = T.seed | 0, boil = f.boil; ctx.strokeStyle = col; ctx.fillStyle = col;
    ctx.globalAlpha = 0.32; jcircle(ctx, S * 0.5, S * 0.13, S * 0.07, dw, 480, boil, 22);                  // lune (ciel degage)
    ctx.globalAlpha = 0.15; jcircle(ctx, S * 0.53, S * 0.11, S * 0.016, dw, 481, boil, 8); jcircle(ctx, S * 0.47, S * 0.15, S * 0.011, dw, 482, boil, 7);
    for (let i = 0; i < 30; i++) { const sx = h2(seed + i * 7, 1) * S, sy = h2(seed + i * 13, 2) * S * 0.34; ctx.globalAlpha = 0.1 + 0.2 * (0.5 + 0.5 * Math.sin(f.t * 1.5 + i)); ctx.fillRect(sx, sy, dw * 0.9, dw * 0.9); }
    // plan lointain : petits immeubles bas au centre (sous le visage), du + loin au + pres
    for (let b = 0; b < 7; b++) { const w = S * 0.14, bx = b * S * 0.14 + S * 0.004, by = S - S * (0.16 + h2(seed + b * 3, 1) * 0.22); cityBld(ctx, S, dw, boil, f, col, bx, by, w, 0.3, 0.4, seed + b * 13); }
    // clusters hauts a gauche et a droite (cadrent le perso)
    cityBld(ctx, S, dw, boil, f, col, S * 0.1, S - S * 0.58, S * 0.13, 0.5, 0.5, seed + 710);
    cityBld(ctx, S, dw, boil, f, col, -S * 0.05, S - S * 0.78, S * 0.16, 0.55, 0.55, seed + 700);
    cityBld(ctx, S, dw, boil, f, col, S * 0.77, S - S * 0.6, S * 0.13, 0.5, 0.5, seed + 730);
    cityBld(ctx, S, dw, boil, f, col, S * 0.9, S - S * 0.8, S * 0.16, 0.55, 0.55, seed + 720);
    ctx.globalAlpha = 1;
  }

  function palm(ctx, x, base, S, t, i, col, dw, boil) {
    ctx.strokeStyle = col;
    const top = base - S * 0.28, sway = Math.sin(t * 0.8 + i) * S * 0.02;
    jpoly(ctx, [{ x, y: base }, { x: x - S * 0.03, y: (base + top) / 2 }, { x: x + sway, y: top }], dw, i * 17, boil, false);
    for (let k = 0; k < 7; k++) { const a = Math.PI + (k / 6) * Math.PI, dx = Math.cos(a) * S * 0.11, dy = -Math.abs(Math.sin(a)) * S * 0.08 - S * 0.02; jpoly(ctx, [{ x: x + sway, y: top }, { x: x + sway + dx * 0.5, y: top + dy * 0.5 - S * 0.03 }, { x: x + sway + dx, y: top + dy + Math.sin(t + k) * 4 }], dw, i * 31 + k, boil, false); }
  }
  // ---- MIAMI : synthwave (soleil raye, montagnes, grille en perspective, palmiers).
  function sceneMiami(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const boil = f.boil; ctx.strokeStyle = col; const hz = S * 0.5, sr = S * 0.16, scy = hz - S * 0.04;
    ctx.globalAlpha = 0.42; jcircle(ctx, S * 0.5, scy, sr, dw, 501, boil, 26);                                   // soleil retro
    for (let i = 0; i < 6; i++) { const yy = scy - sr * 0.5 + i * sr * 0.28; const half = Math.sqrt(Math.max(0, sr * sr - (yy - scy) * (yy - scy))); jline(ctx, S * 0.5 - half, yy, S * 0.5 + half, yy, dw, 502 + i, boil); }
    ctx.globalAlpha = 0.22; jpoly(ctx, [{ x: 0, y: hz }, { x: S * 0.18, y: hz - S * 0.07 }, { x: S * 0.32, y: hz - S * 0.02 }, { x: S * 0.5, y: hz - S * 0.09 }, { x: S * 0.68, y: hz - S * 0.03 }, { x: S * 0.84, y: hz - S * 0.08 }, { x: S, y: hz }], dw, 505, boil, false); // montagnes
    ctx.globalAlpha = 0.3;                                                                                        // grille perspective
    for (let i = -6; i <= 6; i++) { const bx = S * 0.5 + i * S * 0.13; jline(ctx, bx, S, S * 0.5, hz, dw, 510 + i, boil); }
    for (let i = 1; i <= 8; i++) { const p = i / 8, yy = hz + (S - hz) * (p * p); jline(ctx, 0, yy, S, yy, dw, 524 + i, boil); }
    ctx.globalAlpha = 0.4; palm(ctx, S * 0.09, S * 0.92, S, f.t, 0, col, dw, boil); palm(ctx, S * 0.91, S * 0.9, S, f.t, 1, col, dw, boil);
    ctx.globalAlpha = 1;
  }

  // ---- CLUB : faisceaux, boule a facettes + eclats, foule mains levees, enceintes.
  function sceneClub(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const boil = f.boil; ctx.strokeStyle = col; ctx.fillStyle = col;
    for (let i = 0; i < 6; i++) { const ang = Math.sin(f.t * 0.7 + i) * 0.4 + (i - 2.5) * 0.28; ctx.globalAlpha = 0.12 + f.beat * 0.12; jline(ctx, S * 0.5, S * 0.14, S * 0.5 + Math.sin(ang) * S, S * 0.95, dw, 520 + i, boil); }
    ctx.globalAlpha = 0.5; jcircle(ctx, S * 0.5, S * 0.12, S * 0.06, dw, 540, boil, 16);
    for (let i = -2; i <= 2; i++) { jline(ctx, S * 0.5 - S * 0.06, S * 0.12 + i * S * 0.022, S * 0.5 + S * 0.06, S * 0.12 + i * S * 0.022, dw, 541 + i, boil); jline(ctx, S * 0.5 + i * S * 0.022, S * 0.06, S * 0.5 + i * S * 0.022, S * 0.18, dw, 546 + i, boil); }
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2, rr2 = S * 0.11 * (0.5 + 0.5 * Math.sin(f.t * 4 + i)); ctx.globalAlpha = 0.22; ctx.fillRect(S * 0.5 + Math.cos(a) * rr2, S * 0.12 + Math.sin(a) * rr2, dw * 1.2, dw * 1.2); }
    ctx.globalAlpha = 0.34;                                                                                       // foule (mains levees)
    for (let i = 0; i < 9; i++) { const hx = S * (0.06 + i * 0.11), hy = S * 0.99, hd = Math.sin(f.t * 3 + i) * S * 0.025; jcircle(ctx, hx, hy - S * 0.07, S * 0.02, dw, 560 + i, boil, 10); jpoly(ctx, [{ x: hx - S * 0.035, y: hy - S * 0.15 + hd }, { x: hx - S * 0.012, y: hy - S * 0.05 }, { x: hx, y: hy }], dw, 570 + i, boil, false); jpoly(ctx, [{ x: hx + S * 0.035, y: hy - S * 0.15 - hd }, { x: hx + S * 0.012, y: hy - S * 0.05 }, { x: hx, y: hy }], dw, 580 + i, boil, false); }
    ctx.globalAlpha = 0.3; for (const ex of [0.0, 0.9]) { jrect(ctx, S * ex, S * 0.66, S * 0.1, S * 0.3, dw, 550 + ex * 100, boil); jcircle(ctx, S * (ex + 0.05), S * 0.75, S * 0.03, dw, 552 + ex * 100, boil, 12); jcircle(ctx, S * (ex + 0.05), S * 0.87, S * 0.02, dw, 553 + ex * 100, boil, 10); }
    ctx.globalAlpha = 1;
  }

  // ---- TRADING : bougies vertes/magenta + axes + moyenne mobile.
  function sceneTrading(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const boil = f.boil; ctx.strokeStyle = col;
    ctx.globalAlpha = 0.2; jline(ctx, S * 0.06, S * 0.08, S * 0.06, S * 0.92, dw, 558, boil); jline(ctx, S * 0.06, S * 0.92, S * 0.96, S * 0.92, dw, 559, boil);
    ctx.globalAlpha = 0.1; for (let i = 1; i < 6; i++) jline(ctx, S * 0.06, S * i / 6, S, S * i / 6, dw * 0.7, 560 + i, boil);
    const UP = '#22c55e', DN = '#ff2ec4', bars = f.spectrum, n = bars.length, x0 = S * 0.07, gap = (S * 0.9) / n, mids = [];
    for (let i = 0; i < n; i++) {
      const v = bars[i], cx = x0 + i * gap + gap * 0.5, bodyH = 16 + v * S * 0.4, mid = S * 0.55 - (v - 0.5) * S * 0.34 + Math.sin(f.t * 2.2 + i * 0.5) * 5;
      mids.push({ x: cx, y: mid });
      const up = v >= (bars[i - 1] != null ? bars[i - 1] : 0.5), cc = up ? UP : DN; ctx.strokeStyle = cc; ctx.fillStyle = cc;
      ctx.globalAlpha = 0.5; jline(ctx, cx, mid - bodyH * 0.75, cx, mid + bodyH * 0.75, dw, 570 + i, boil);
      ctx.globalAlpha = 0.26; ctx.fillRect(cx - gap * 0.3, mid - bodyH * 0.42, gap * 0.6, bodyH * 0.84);
      ctx.globalAlpha = 0.7; jrect(ctx, cx - gap * 0.3, mid - bodyH * 0.42, gap * 0.6, bodyH * 0.84, dw, 600 + i, boil);
    }
    ctx.strokeStyle = col; ctx.globalAlpha = 0.4; ctx.lineWidth = dw; ctx.lineCap = 'round'; ctx.beginPath();       // moyenne mobile
    for (let i = 0; i < mids.length; i++) { if (i === 0) ctx.moveTo(mids[0].x, mids[0].y); else { const mx = (mids[i - 1].x + mids[i].x) / 2, my = (mids[i - 1].y + mids[i].y) / 2; ctx.quadraticCurveTo(mids[i - 1].x, mids[i - 1].y, mx, my); } }
    ctx.stroke(); ctx.globalAlpha = 1;
  }

  // ---- POSTERS : affiches dechirees (aplats en contour, sans texte).
  function scenePosters(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const seed = T.seed | 0, boil = f.boil; ctx.strokeStyle = col; ctx.globalAlpha = 0.34;
    for (let p = 0; p < 7; p++) {
      const px = h2(seed + p * 31, 1) * S * 0.78, py = h2(seed + p * 57, 2) * S * 0.78, pw = S * (0.16 + h2(seed + p * 13, 3) * 0.13), ph = pw * 1.3;
      ctx.save(); ctx.translate(px, py); ctx.rotate((h2(seed + p, 4) - 0.5) * 0.24);
      const edge = [];
      for (let e = 0; e <= 8; e++) edge.push({ x: pw * e / 8, y: (h2(seed + p * 9 + e, 5) - 0.5) * 14 });
      for (let e = 0; e <= 8; e++) edge.push({ x: pw + (h2(seed + p * 3 + e, 6) - 0.5) * 14, y: ph * e / 8 });
      for (let e = 8; e >= 0; e--) edge.push({ x: pw * e / 8, y: ph + (h2(seed + p * 5 + e, 7) - 0.5) * 14 });
      for (let e = 8; e >= 0; e--) edge.push({ x: (h2(seed + p * 7 + e, 8) - 0.5) * 14, y: ph * e / 8 });
      jpoly(ctx, edge, dw, seed + p, boil, true);
      jline(ctx, pw * 0.18, ph * 0.36, pw * 0.82, ph * 0.36, dw, seed + p * 3, boil); jline(ctx, pw * 0.18, ph * 0.52, pw * 0.7, ph * 0.52, dw, seed + p * 5, boil);
      jrect(ctx, pw * 0.2, ph * 0.62, pw * 0.6, ph * 0.28, dw, seed + p * 7, boil);   // zone image
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawScene(ctx, S, T, f, col, dw) {
    switch (T.bgStyle) {
      case 'city': sceneCity(ctx, S, T, f, col, dw); break;
      case 'miami': sceneMiami(ctx, S, T, f, col, dw); break;
      case 'club': sceneClub(ctx, S, T, f, col, dw); break;
      case 'trading': sceneTrading(ctx, S, T, f, col, dw); break;
      case 'posters': scenePosters(ctx, S, T, f, col, dw); break;
      case 'metro': sceneMetro(ctx, S, T, f, col, dw); break;
      case 'penthouse': scenePenthouse(ctx, S, T, f, col, dw); break;
      default: sceneBricks(ctx, S, T, f, col, dw);
    }
  }

  // ---- METRO : tunnel en perspective (point de fuite) + rails + rame qui approche.
  function sceneMetro(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const boil = f.boil; ctx.strokeStyle = col; const vx = S * 0.5, vy = S * 0.34;
    ctx.globalAlpha = 0.3;
    for (let i = 0; i < 5; i++) { const p = i / 5, w = S * (0.96 - p * 0.82), h = S * (0.92 - p * 0.8), x = vx - w / 2, y = vy - h * 0.42; jrect(ctx, x, y, w, h, dw, 720 + i, boil); }   // anneaux
    jline(ctx, 0, S * 0.04, vx, vy, dw, 730, boil); jline(ctx, S, S * 0.04, vx, vy, dw, 731, boil); jline(ctx, 0, S * 0.96, vx, vy, dw, 732, boil); jline(ctx, S, S * 0.96, vx, vy, dw, 733, boil);
    ctx.globalAlpha = 0.24; for (let i = 1; i <= 4; i++) { const yy = vy + (S - vy) * (i / 4) * (i / 4); jline(ctx, 0 + (yy < S ? 0 : 0), yy, S, yy, dw * 0.7, 736 + i, boil); }  // dalles quai
    ctx.globalAlpha = 0.32; jline(ctx, S * 0.34, S, vx - S * 0.02, vy + S * 0.06, dw, 734, boil); jline(ctx, S * 0.66, S, vx + S * 0.02, vy + S * 0.06, dw, 735, boil);              // rails
    const app = 0.5 + 0.5 * Math.sin(f.t * 0.8), tw = S * 0.13 * (0.55 + app * 0.6), th = S * 0.15 * (0.55 + app * 0.6);
    ctx.globalAlpha = 0.5; jrect(ctx, vx - tw / 2, vy - th * 0.25, tw, th, dw, 740, boil);
    ctx.globalAlpha = 0.35; jrect(ctx, vx - tw * 0.3, vy - th * 0.1, tw * 0.22, th * 0.3, dw, 741, boil); jrect(ctx, vx + tw * 0.08, vy - th * 0.1, tw * 0.22, th * 0.3, dw, 742, boil);  // fenetres rame
    ctx.globalAlpha = 0.4 + 0.5 * app; jcircle(ctx, vx - tw * 0.28, vy + th * 0.5, tw * 0.09, dw, 743, boil, 8); jcircle(ctx, vx + tw * 0.28, vy + th * 0.5, tw * 0.09, dw, 744, boil, 8);
    ctx.globalAlpha = 1;
  }

  // ---- PENTHOUSE : baie vitree + skyline detaillee derriere + plante d'interieur.
  function scenePenthouse(ctx, S, T, f, col, dw) {
    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, S, S);
    const seed = T.seed | 0, boil = f.boil; ctx.strokeStyle = col; ctx.fillStyle = col;
    for (let i = 0; i < 14; i++) { const sx = h2(seed + i * 3, 5) * S, sy = h2(seed + i * 9, 6) * S * 0.32; ctx.globalAlpha = 0.14; ctx.fillRect(sx, sy, dw, dw); }  // etoiles
    for (let b = 0; b < 11; b++) {                                                                                 // skyline (immeubles pleins noirs, occlusion)
      const bw = S * 0.085, bx = S * 0.07 + b * S * 0.078, h = S * (0.16 + h2(seed + b * 7, 1) * 0.4), by = S * 0.8 - h;
      ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(bx - 2, by, bw + 4, h + 4);
      ctx.globalAlpha = 0.28; ctx.strokeStyle = col; jpoly(ctx, [{ x: bx, y: S * 0.8 }, { x: bx, y: by }, { x: bx + bw, y: by }, { x: bx + bw, y: S * 0.8 }], dw, seed + b * 5, boil, false);
      const rows = Math.floor(h / (S * 0.05)); ctx.fillStyle = col;
      for (let r = 0; r < rows; r++) for (let ci = 0; ci < 2; ci++) { const lit = h2(seed + b * 31 + r * 7 + ci, 4); ctx.globalAlpha = lit < 0.5 ? 0.5 : 0.1; ctx.fillRect(bx + bw * 0.18 + ci * bw * 0.4, by + S * 0.028 + r * S * 0.05, bw * 0.24, S * 0.02); }
    }
    ctx.globalAlpha = 0.5; jrect(ctx, S * 0.05, S * 0.05, S * 0.9, S * 0.8, dw, 760, boil);                        // baie vitree
    for (let i = 1; i < 3; i++) jline(ctx, S * 0.05 + i * S * 0.3, S * 0.05, S * 0.05 + i * S * 0.3, S * 0.85, dw, 761 + i, boil);
    jline(ctx, S * 0.05, S * 0.45, S * 0.95, S * 0.45, dw, 764, boil);
    ctx.globalAlpha = 0.34; jrect(ctx, S * 0.02, S * 0.86, S * 0.09, S * 0.11, dw, 770, boil);                     // plante en pot
    for (let i = 0; i < 5; i++) { const a = -Math.PI / 2 + (i - 2) * 0.42; jpoly(ctx, [{ x: S * 0.065, y: S * 0.86 }, { x: S * 0.065 + Math.cos(a) * S * 0.05, y: S * 0.86 + Math.sin(a) * S * 0.12 }], dw, 771 + i, boil, false); }
    ctx.globalAlpha = 1;
  }

  // Equalizer : barres neon reactives (spectre reel via AnalyserNode, sinon idle).
  // Dessine en coordonnees carrees, derriere le personnage.
  function drawEqualizer(ctx, S, bars, col, beat) {
    const n = bars.length, gap = S / n, bw = gap * 0.64;
    const base = S * 0.992, maxH = S * 0.56;                  // au moins la moitie de la hauteur
    ctx.save();
    const gg = ctx.createLinearGradient(0, S, 0, S * 0.35);   // lueur de sol pulsee
    gg.addColorStop(0, hexA(col, 0.22 + beat * 0.16)); gg.addColorStop(1, hexA(col, 0));
    ctx.fillStyle = gg; ctx.fillRect(0, S * 0.35, S, S * 0.65);
    for (let i = 0; i < n; i++) {
      const v = bars[i], h = Math.max(4, v * maxH), x = i * gap + gap * 0.5, y = base - h;
      const g = ctx.createLinearGradient(0, base, 0, y);
      g.addColorStop(0, hexA(col, 0.10)); g.addColorStop(1, hexA(col, 0.95));
      ctx.fillStyle = g;
      const r = Math.min(bw * 0.5, 10);
      ctx.beginPath();
      ctx.moveTo(x - bw / 2, base); ctx.lineTo(x - bw / 2, y + r);
      ctx.quadraticCurveTo(x - bw / 2, y, x - bw / 2 + r, y);
      ctx.lineTo(x + bw / 2 - r, y); ctx.quadraticCurveTo(x + bw / 2, y, x + bw / 2, y + r);
      ctx.lineTo(x + bw / 2, base); ctx.closePath(); ctx.fill();
      ctx.fillStyle = hexA(col, 1);                            // capuchon lumineux
      ctx.beginPath(); ctx.ellipse(x, y, bw * 0.5, bw * 0.28, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  // Barres "idle" un peu plus hautes pour occuper le fond meme sans audio.
  function idleBars(n, t) {
    const a = new Array(n);
    for (let i = 0; i < n; i++) a[i] = clamp(0.28 + 0.18 * Math.sin(t * 2.2 + i * 0.5) + 0.10 * Math.sin(t * 5 + i), 0.05, 1);
    return a;
  }

  // Fond complet du carre : decor au trait (couleur hoodie, demi-epaisseur) + equalizer.
  function paintBg(ctx, S, T, f) {
    ctx.save();
    const scv = (S / 1000) * 0.82;                          // echelle visuelle du perso
    const decorCol = T.hoodColor;                           // meme couleur que l'outline du hoodie
    const decorW = Math.max(1.4, T.lineBase * 1.5 * scv * 0.5); // moitie de l'epaisseur du hoodie
    drawScene(ctx, S, T, f, decorCol, decorW);
    if (T.bgStyle !== 'trading') drawEqualizer(ctx, S, f.spectrum, T.eqColor, f.beat);
    ctx.restore();
  }

  /* ============================ PEINTURE =============================== */
  // frame = { t (s), beat (0..1 pulse basse), nowMs (ms), spectrum (0..1[] | null) }
  // L'oeuvre est VERROUILLEE au format carre (letterbox noir autour).
  function paint(ctx, W, H, T, frame) {
    const t = frame.t || 0, beat = frame.beat || 0, nowMs = frame.nowMs || 0;
    const boil = Math.floor(t * 10);            // ~10 pas d'encre / s -> lignes vivantes
    const BARS = 32;
    const spectrum = (frame.spectrum && frame.spectrum.length) ? frame.spectrum : idleBars(BARS, t);

    // Letterbox noir sur tout le canvas, puis on cadre un carre centre S x S.
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
    const S = Math.min(W, H), ox = (W - S) / 2, oy = (H - S) / 2;

    ctx.save();
    ctx.beginPath(); ctx.rect(ox, oy, S, S); ctx.clip();   // rien ne deborde du carre
    ctx.translate(ox, oy);

    // Fond du carre : mur de briques genératif + equalizer (derriere le perso).
    paintBg(ctx, S, T, { t, beat, boil, spectrum });

    const sc = (S / 1000) * 0.82;               // headroom en haut pour le titre
    const el = nowMs - T.pressAt;               // rebond au tap (squash & stretch)
    let sx = 1, sy = 1;
    if (el >= 0 && el < 420) { const a = Math.exp(-el / 130) * 0.11 * Math.cos(el / 130 * Math.PI * 1.4); sx = 1 + a; sy = 1 - a; }
    const bob = Math.sin(t * 1.8) * 5 + beat * 18;
    const tilt = Math.sin(t * 0.7) * 0.016 + beat * 0.010;

    ctx.save();
    ctx.translate(S / 2, S / 2 + 96 * sc);
    ctx.rotate(tilt);
    ctx.scale(sc * sx, sc * sy);
    ctx.translate(0, -bob);

    const lb = T.lineBase, ba = T.boilAmp, hc = T.hoodColor;
    const OW = lb * 1.5;                     // epaisseur d'outline UNIQUE (ref = hoodie)

    /* -- 1. Silhouette hoodie : noir plein (occlude le mur) + contour marker couleur.
       Forme plus anguleuse, epaules marquees (cf. HEY DUDE). -- */
    const hood = [
      { x: -452, y: 560 }, { x: -448, y: 344 }, { x: -410, y: 172 },
      { x: -360, y: 20 }, { x: -318, y: -150 }, { x: -232, y: -300 },
      { x: -112, y: -398 }, { x: 0, y: -420 }, { x: 112, y: -398 },
      { x: 232, y: -300 }, { x: 318, y: -150 }, { x: 360, y: 20 },
      { x: 410, y: 172 }, { x: 448, y: 344 }, { x: 452, y: 560 }, { x: 452, y: 600 }, { x: -452, y: 600 }
    ];
    inkFill(ctx, hood, { fill: HOOD, seed: 21, boil, amp: ba * 1.4, tang: ba });                 // occlusion noire
    inkFill(ctx, hood, { w: OW, color: hc, seed: 21, boil, amp: ba * 1.4, tang: ba });     // contour couleur
    // capuche : ligne interieure qui suit le visage (donne le drape du hoodie)
    ink(ctx, [{ x: -292, y: 60 }, { x: -230, y: -210 }, { x: -70, y: -360 }, { x: 0, y: -378 }, { x: 70, y: -360 }, { x: 230, y: -210 }, { x: 292, y: 60 }], { w: OW, color: hc, amp: ba, seed: 24, boil });

    /* -- 2. Visage : soit ouverture noire a contour blanc, soit skull blanc plein -- */
    const fw = 250, ftop = -250, fbot = 250, midY = (ftop + fbot) / 2;
    const face = [
      { x: 0, y: ftop }, { x: fw * 0.55, y: ftop + 6 }, { x: fw * 0.9, y: ftop + 74 },
      { x: fw, y: midY - 44 }, { x: fw * 0.99, y: midY + 66 }, { x: fw * 0.82, y: fbot - 92 },
      { x: fw * 0.5, y: fbot - 22 }, { x: 0, y: fbot }, { x: -fw * 0.5, y: fbot - 22 },
      { x: -fw * 0.82, y: fbot - 92 }, { x: -fw * 0.99, y: midY + 66 }, { x: -fw, y: midY - 44 },
      { x: -fw * 0.9, y: ftop + 74 }, { x: -fw * 0.55, y: ftop + 6 }
    ];
    if (T.skull) {
      inkFill(ctx, face, { fill: FEAT, w: OW, color: FEAT, seed: 31, boil, amp: ba, tang: ba * 0.6 }); // skull blanc plein
    } else {
      inkFill(ctx, face, { w: OW, color: hc, seed: 31, boil, amp: ba, tang: ba * 0.6 });               // ouverture tracee dans la couleur du hoodie
    }

    /* -- 3. Details hoodie : col en V + plis (couleur) -- */
    ink(ctx, [{ x: -150, y: 300 }, { x: 0, y: 372 }, { x: 150, y: 300 }], { w: OW, color: hc, amp: ba, seed: 26, boil });
    ink(ctx, [{ x: -300, y: 470 }, { x: -250, y: 360 }], { w: OW, color: hc, amp: ba, seed: 27, boil });
    ink(ctx, [{ x: 300, y: 470 }, { x: 250, y: 360 }], { w: OW, color: hc, amp: ba, seed: 28, boil });

    /* -- 4. Oreilles (petits "c") -- */
    if (T.ears) {
      ink(ctx, arcPts(-fw * 0.99, midY - 6, 44, Math.PI * 0.5, Math.PI * 1.5, 10), { w: OW, color: FEAT, amp: ba, seed: 33, boil });
      ink(ctx, arcPts(fw * 0.99, midY - 6, 44, -Math.PI * 0.5, Math.PI * 0.5, 10), { w: OW, color: FEAT, amp: ba, seed: 34, boil });
    }

    /* -- 5. Cheveux : meches fines blanches sur les cotes -- */
    if (T.hair !== 'none') {
      const n = T.hair === 'strands' ? 6 : T.hair === 'sidebangs' ? 4 : 3;
      const hairSway = Math.sin(t * 1.3) * 10 + beat * 6;
      for (let i = 0; i < n; i++) {
        const side = i % 2 ? 1 : -1;
        const rj = mulberry32(i * 7 + T.seed);
        const x0 = side * rr(rj, fw * 0.5, fw * 0.95);
        const len = rr(rj, 260, 520);
        const drift = side * rr(rj, 8, 40) + hairSway * (0.4 + rj() * 0.6);
        ctx.globalAlpha = 0.8;
        ink(ctx, [{ x: x0, y: ftop + 40 }, { x: x0 + drift, y: ftop + 40 + len * 0.5 }, { x: x0 + drift * 0.5, y: ftop + 40 + len }], { w: OW, amp: ba, seed: 40 + i, boil, color: FEAT });
        ctx.globalAlpha = 1;
      }
    }

    /* -- 6. Chapeau (contour marker, bas sur le front) -- */
    drawHat(ctx, T, boil, lb, ba, ftop, fw);

    /* -- 7. Features : yeux + nez, puis lunettes par-dessus, puis bouche -- */
    FEATC = T.skull ? '#111111' : FEAT;
    const eyeY = ftop + 250, eyeDX = fw * 0.36, eyeS = 82;
    const ex = EXPRESSIONS[T.exprIndex];
    const bt = t * 0.9 + T.blinkSeed;
    const blink = clamp((Math.sin(bt) > 0.985 ? (Math.sin(bt) - 0.985) / 0.015 : 0), 0, 1);
    drawEye(ctx, -eyeDX, eyeY, eyeS, ex.eye, 0, 70, boil, ex.eye === 'closed' ? 1 : blink, OW);
    drawEye(ctx, eyeDX, eyeY, eyeS, ex.eye, 1, 71, boil, ex.eye === 'closed' ? 1 : blink, OW);
    inkFill(ctx, circlePts(-14, eyeY + 92, 6, 8), { fill: FEATC, seed: 64, boil, amp: 2 });
    inkFill(ctx, circlePts(14, eyeY + 92, 6, 8), { fill: FEATC, seed: 65, boil, amp: 2 });
    if (T.glassesType !== 'none') drawGlasses(ctx, T.glassesType, eyeDX, eyeY, eyeS, lb, ba, boil, FEATC, T.hatColor);

    /* -- 8. Bouche -- */
    const mouthY = fbot - 92;
    drawMouth(ctx, 0, mouthY, 210, ex.mouth, 80, boil, OW);
    FEATC = FEAT;                          // on remet le blanc par defaut

    /* -- 9. Accessoires (cigarette, chaine, boucle, bombe) -- */
    drawAccessories(ctx, T, t, beat, boil, lb, ba, { fw, ftop, fbot, midY, eyeY, eyeDX, eyeS, mouthY });

    /* -- 10. Cordons (couleur hoodie) -- */
    if (T.strings) {
      const sl = 300 * T.stringLen;
      const sway = Math.sin(t * 1.6) * 16 + beat * 8;
      drawString(ctx, -70, 356, -70 + sway * 0.4, 356 + sl, lb, ba, hc, 90, boil);
      drawString(ctx, 70, 356, 70 - sway * 0.4, 356 + sl * 0.92, lb, ba, hc, 91, boil);
    }

    ctx.restore();   // fin transform perso

    /* -- 11. Titre (citation) en HAUT, typo BLANCHE + mot en bas (couleur) -- */
    const qs = clamp(S * 0.1, 26, 124);
    scrawl(ctx, QUOTES[T.quoteIndex], S / 2, S * 0.11, qs, '#ffffff', T.seed & 0xffff, Math.floor(t * 6), 'center');

    ctx.restore();   // fin carre
  }

  /* --------------------------- Chapeaux (contour marker) ---------------- */
  // Arc de dome lisse (base gauche -> sommet -> base droite), ferme = ligne de base.
  function domePts(cx, yBase, rx, ry, k) {
    k = k || 18; const a = [];
    for (let i = 0; i <= k; i++) { const th = Math.PI * (i / k); a.push({ x: cx - Math.cos(th) * rx, y: yBase - Math.sin(th) * ry }); }
    return a;
  }
  // Ellipse (visiere de casquette propre) : moitie interne masquee par la couronne.
  function ellipsePts(cx, cy, rx, ry, rot, k) {
    k = k || 26; const a = [], cs = Math.cos(rot), sn = Math.sin(rot);
    for (let i = 0; i <= k; i++) { const th = i / k * Math.PI * 2, ex = Math.cos(th) * rx, ey = Math.sin(th) * ry; a.push({ x: cx + ex * cs - ey * sn, y: cy + ex * sn + ey * cs }); }
    return a;
  }
  function drawHat(ctx, T, boil, lb, ba, ftop, fw) {
    const c = T.hatColor;
    const ow = lb * 1.5;                            // meme epaisseur que le hoodie
    const cap = (pts, sd) => { inkFill(ctx, pts, { fill: HOOD, seed: sd, boil, amp: ba }); inkFill(ctx, pts, { w: ow, color: c, seed: sd, boil, amp: ba }); };
    const strip = (pts, sd) => { inkFill(ctx, pts, { fill: HOOD, seed: sd, boil, amp: ba }); inkFill(ctx, pts, { w: ow, color: c, seed: sd, boil, amp: ba }); };
    const brow = ftop + 8;                         // ligne front / base du chapeau

    if (T.hatType === 'bucket') {
      const dome = domePts(0, brow + 24, fw * 0.92, 210, 16); cap(dome, 101);
      const brim = [{ x: -fw * 1.34, y: brow + 40 }, { x: -fw * 0.6, y: brow + 104 }, { x: 0, y: brow + 116 }, { x: fw * 0.6, y: brow + 104 }, { x: fw * 1.34, y: brow + 40 }, { x: fw * 1.06, y: brow - 12 }, { x: 0, y: brow + 34 }, { x: -fw * 1.06, y: brow - 12 }];
      cap(brim, 102);
      hatEmblem(ctx, T, 0, brow - 66, 44, boil, lb, c);

    } else if (T.hatType === 'beanie' || T.hatType === 'beaniePom') {
      const dome = domePts(0, brow + 46, fw * 0.96, 232, 18); cap(dome, 111);
      const cuff = [{ x: -fw * 1.02, y: brow + 8 }, { x: fw * 1.02, y: brow + 8 }, { x: fw * 1.02, y: brow + 84 }, { x: -fw * 1.02, y: brow + 84 }];
      strip(cuff, 112, lb * 1.1);
      ink(ctx, [{ x: -fw * 0.98, y: brow + 46 }, { x: fw * 0.98, y: brow + 46 }], { w: lb * 0.6, color: c, amp: ba * 0.4, seed: 116, boil });
      if (T.hatType === 'beaniePom') {
        inkFill(ctx, circlePts(0, brow - 214, 30, 14), { fill: HOOD, seed: 115, boil, amp: ba });
        inkFill(ctx, circlePts(0, brow - 214, 30, 14), { w: lb, color: c, seed: 115, boil, amp: ba });
        for (let i = 0; i < 8; i++) { const a2 = i / 8 * Math.PI * 2; ink(ctx, [{ x: Math.cos(a2) * 24, y: brow - 214 + Math.sin(a2) * 24 }, { x: Math.cos(a2) * 40, y: brow - 214 + Math.sin(a2) * 40 }], { w: lb * 0.5, color: c, amp: 1, seed: 300 + i, boil }); }
      }

    } else if (T.hatType === 'cowboy') {
      const brim = [
        { x: -fw * 1.62, y: brow + 30 }, { x: -fw * 0.8, y: brow + 4 }, { x: 0, y: brow + 20 }, { x: fw * 0.8, y: brow + 4 }, { x: fw * 1.62, y: brow + 30 },
        { x: fw * 1.5, y: brow + 82 }, { x: fw * 0.8, y: brow + 54 }, { x: 0, y: brow + 66 }, { x: -fw * 0.8, y: brow + 54 }, { x: -fw * 1.5, y: brow + 82 }
      ];
      cap(brim, 190);
      const crown = [{ x: -fw * 0.64, y: brow + 12 }, { x: -fw * 0.54, y: brow - 150 }, { x: -fw * 0.22, y: brow - 112 }, { x: 0, y: brow - 168 }, { x: fw * 0.22, y: brow - 112 }, { x: fw * 0.54, y: brow - 150 }, { x: fw * 0.64, y: brow + 12 }];
      cap(crown, 191);
      const band = [{ x: -fw * 0.64, y: brow - 20 }, { x: fw * 0.64, y: brow - 20 }, { x: fw * 0.64, y: brow + 12 }, { x: -fw * 0.64, y: brow + 12 }];
      strip(band, 192, lb * 0.9);
      inkFill(ctx, circlePts(0, brow - 4, 12, 10), { w: lb * 0.6, color: c, seed: 193, boil, amp: 1 });

    } else if (T.hatType === 'crown') {
      const bandR = [{ x: -fw * 0.92, y: brow + 6 }, { x: fw * 0.92, y: brow + 6 }, { x: fw * 0.92, y: brow + 60 }, { x: -fw * 0.92, y: brow + 60 }];
      strip(bandR, 200, lb * 1.1);
      const n = 4, sp = [{ x: -fw * 0.92, y: brow + 6 }];
      for (let i = 0; i < n; i++) { sp.push({ x: -fw * 0.92 + (fw * 1.84) * (i / n), y: brow + 6 }); sp.push({ x: -fw * 0.92 + (fw * 1.84) * ((i + 0.5) / n), y: brow - 118 }); sp.push({ x: -fw * 0.92 + (fw * 1.84) * ((i + 1) / n), y: brow + 6 }); }
      sp.push({ x: fw * 0.92, y: brow + 6 });
      cap(sp, 201);
      for (let i = 0; i <= n; i++) inkFill(ctx, circlePts(-fw * 0.92 + (fw * 1.84) * (i / n), brow - 118, 12, 10), { fill: c, seed: 202 + i, boil, amp: 1 });

    } else if (T.hatType === 'visor') {
      // Visiere : bandeau + lame en UNE seule silhouette (aucune jonction visible), sommet ouvert.
      const shape = [
        { x: -fw * 1.0, y: brow - 30 }, { x: fw * 1.0, y: brow - 30 }, { x: fw * 0.98, y: brow + 4 },
        { x: fw * 1.44, y: brow + 16 }, { x: fw * 1.56, y: brow + 34 }, { x: fw * 1.34, y: brow + 48 },
        { x: fw * 0.7, y: brow + 50 }, { x: fw * 0.06, y: brow + 40 }, { x: -fw * 1.0, y: brow + 18 }
      ];
      inkFill(ctx, shape, { fill: HOOD, seed: 210, boil, amp: ba });
      inkFill(ctx, shape, { w: ow, color: c, seed: 210, boil, amp: ba });
      ink(ctx, [{ x: fw * 0.22, y: brow + 30 }, { x: fw * 0.85, y: brow + 42 }, { x: fw * 1.34, y: brow + 40 }], { w: ow * 0.7, color: c, amp: ba * 0.5, seed: 213, boil });

    } else if (T.hatType === 'fitted') {
      // Casquette fitted : couronne + visiere en UNE seule silhouette + coutures + bouton.
      const shape = domePts(0, brow, fw * 1.0, 252, 22).concat([
        { x: fw * 0.98, y: brow + 4 }, { x: fw * 1.44, y: brow + 16 }, { x: fw * 1.56, y: brow + 34 },
        { x: fw * 1.34, y: brow + 48 }, { x: fw * 0.7, y: brow + 50 }, { x: fw * 0.06, y: brow + 40 }, { x: -fw * 0.24, y: brow + 14 }
      ]);
      inkFill(ctx, shape, { fill: HOOD, seed: 121, boil, amp: ba });
      inkFill(ctx, shape, { w: ow, color: c, seed: 121, boil, amp: ba });
      ink(ctx, [{ x: 0, y: brow - 244 }, { x: 0, y: brow - 6 }], { w: lb * 0.5, color: c, amp: ba * 0.4, seed: 126, boil });
      ink(ctx, [{ x: -fw * 0.5, y: brow - 176 }, { x: -fw * 0.44, y: brow - 6 }], { w: lb * 0.4, color: c, amp: ba * 0.4, seed: 127, boil });
      ink(ctx, [{ x: fw * 0.5, y: brow - 176 }, { x: fw * 0.44, y: brow - 6 }], { w: lb * 0.4, color: c, amp: ba * 0.4, seed: 128, boil });
      inkFill(ctx, circlePts(0, brow - 246, 8, 8), { fill: c, seed: 129, boil, amp: 1 });
      hatEmblem(ctx, T, 0, brow - 104, 32, boil, lb, c);
      ink(ctx, [{ x: fw * 0.22, y: brow + 30 }, { x: fw * 0.85, y: brow + 42 }, { x: fw * 1.34, y: brow + 40 }], { w: ow * 0.7, color: c, amp: ba * 0.5, seed: 133, boil });

    } else if (T.hatType === 'capback') {
      // Casquette a l'envers : petite visiere arriere en lame (gauche), couronne, snap.
      const brimBack = [{ x: -fw * 0.92, y: brow + 8 }, { x: -fw * 1.2, y: brow - 4 }, { x: -fw * 1.5, y: brow + 8 }, { x: -fw * 1.2, y: brow + 24 }];
      cap(brimBack, 122);
      const crown = domePts(0, brow, fw * 1.0, 248, 20); cap(crown, 121);
      const snap = [{ x: -fw * 0.52, y: brow - 40 }, { x: fw * 0.52, y: brow - 40 }, { x: fw * 0.52, y: brow + 18 }, { x: -fw * 0.52, y: brow + 18 }];
      strip(snap, 123);
      inkFill(ctx, circlePts(0, brow - 11, 13, 12), { w: ow, color: c, seed: 124, boil, amp: ba });

    } else {
      // Snapback : couronne + visiere en UNE seule silhouette continue (aucune encoche),
      // le bandeau label est un detail INTERNE sur le devant de la couronne.
      const shape = domePts(0, brow, fw * 1.02, 248, 22).concat([
        { x: fw * 0.98, y: brow + 4 }, { x: fw * 1.44, y: brow + 16 }, { x: fw * 1.56, y: brow + 34 },
        { x: fw * 1.34, y: brow + 48 }, { x: fw * 0.7, y: brow + 50 }, { x: fw * 0.06, y: brow + 40 }, { x: -fw * 0.24, y: brow + 14 }
      ]);
      inkFill(ctx, shape, { fill: HOOD, seed: 121, boil, amp: ba });
      inkFill(ctx, shape, { w: ow, color: c, seed: 121, boil, amp: ba });
      const band = [{ x: -fw * 0.66, y: brow - 52 }, { x: fw * 0.66, y: brow - 52 }, { x: fw * 0.64, y: brow - 4 }, { x: -fw * 0.64, y: brow - 4 }];
      strip(band, 123);
      ink(ctx, [{ x: fw * 0.22, y: brow + 30 }, { x: fw * 0.85, y: brow + 42 }, { x: fw * 1.34, y: brow + 40 }], { w: ow * 0.7, color: c, amp: ba * 0.5, seed: 127, boil });  // dessous de visiere
    }

    if (T.headphones) {
      const hy = ftop + 585, hx = fw * 0.86, cr = 74;
      ink(ctx, [{ x: -hx, y: hy - cr * 0.2 }, { x: 0, y: hy + cr * 0.9 }, { x: hx, y: hy - cr * 0.2 }], { w: ow, color: c, amp: ba, seed: 130, boil, doubled: true });
      inkFill(ctx, circlePts(-hx, hy, cr, 18), { fill: HOOD, seed: 131, boil, amp: ba }); inkFill(ctx, circlePts(-hx, hy, cr, 18), { w: ow, color: c, seed: 131, boil, amp: ba });
      inkFill(ctx, circlePts(hx, hy, cr, 18), { fill: HOOD, seed: 132, boil, amp: ba }); inkFill(ctx, circlePts(hx, hy, cr, 18), { w: ow, color: c, seed: 132, boil, amp: ba });
      inkFill(ctx, circlePts(-hx, hy, cr * 0.4, 12), { w: ow, color: c, seed: 133, boil, amp: ba * 0.5 });
      inkFill(ctx, circlePts(hx, hy, cr * 0.4, 12), { w: ow, color: c, seed: 134, boil, amp: ba * 0.5 });
    }
  }

  function hatEmblem(ctx, T, x, y, r, boil, lb, c) {
    inkFill(ctx, circlePts(x, y, r, 16), { w: lb * 0.8, color: c, seed: 141, boil, amp: 2 });   // cercle contour
    ink(ctx, arcPts(x, y + r * 0.1, r * 0.5, Math.PI, Math.PI * 2, 10), { w: lb * 0.55, color: c, amp: 1.5, seed: 142, boil });
    ink(ctx, [{ x: x - r * 0.5, y: y + r * 0.1 }, { x: x - r * 0.5, y: y + r * 0.5 }], { w: lb * 0.55, color: c, amp: 1.5, seed: 143, boil });
    ink(ctx, [{ x: x + r * 0.5, y: y + r * 0.1 }, { x: x + r * 0.5, y: y + r * 0.5 }], { w: lb * 0.55, color: c, amp: 1.5, seed: 144, boil });
  }

  /* --------------------------- Lunettes --------------------------------- */
  function drawGlasses(ctx, type, dx, y, s, lb, ba, boil, frame, accent) {
    const ow = lb * 1.5;
    const r = s * 0.98;
    const bridge = () => ink(ctx, [{ x: -dx + r * 0.9, y }, { x: dx - r * 0.9, y }], { w: ow, amp: ba * 0.4, seed: 63, boil, color: frame });
    const arms = () => { ink(ctx, [{ x: -dx - r, y: y - r * 0.2 }, { x: -dx - r * 1.5, y: y - r * 0.4 }], { w: ow, color: frame, seed: 66, boil, amp: ba * 0.4 }); ink(ctx, [{ x: dx + r, y: y - r * 0.2 }, { x: dx + r * 1.5, y: y - r * 0.4 }], { w: ow, color: frame, seed: 67, boil, amp: ba * 0.4 }); };
    if (type === 'round') {
      inkFill(ctx, circlePts(-dx, y, r, 16), { w: ow, color: frame, seed: 61, boil, amp: ba * 0.5 });
      inkFill(ctx, circlePts(dx, y, r, 16), { w: ow, color: frame, seed: 62, boil, amp: ba * 0.5 });
      bridge(); arms();

    cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    W = cv.width; H = cv.height;
  }
  window.addEventListener('resize', resize); resize();

  /* --- Frame canonique --------------------------------------------------
     La piece est animee : sans instant fixe, deux captures du meme token
     different. Le mode preview peint une seule frame a t = 3s,
     spectre a zero, sans jamais toucher au moteur audio.                   */
  var PREVIEW = qs.get('preview') === '1' ||
                (function(){ try { return !!(window.tokenData && window.tokenData.preview); } catch(e){ return false; } })();
  var SILENT = new Array(32).fill(0);

  function paintCanonical(){
    Eng.paint(ctx, W, H, token, { t: 3, beat: 0, nowMs: 3 * 1000, spectrum: SILENT });
    window.__hoodlrzPreviewReady = true;   // signal de capture pour l'outillage
  }

  /* --- Interaction ------------------------------------------------------
     L'audio ne demarre QUE sur geste utilisateur : les iframes de
     marketplace bloquent l'autoplay, et une exception non capturee ici
     casserait la boucle de rendu.                                          */
  function tap(e){
    e.preventDefault();
    try { audio.start(); } catch (err) {}
    Eng.advance(token, performance.now());
    try { audio.blip(); } catch (err) {}
  }
  if (!PREVIEW) {
    cv.addEventListener('pointerdown', tap, { passive: false });
    window.addEventListener('keydown', function (e){
      if (e.key === 'm' || e.key === 'M') { try { audio.setMuted(!audio.muted); } catch (err) {} }
    });
  }

  __whenFontReady(function(){
    if (PREVIEW) { paintCanonical(); return; }
    (function frame(){
      var now = performance.now(), t = (now - t0) / 1000;
      var spec;
      try { spec = audio.getSpectrum(32); } catch (err) { spec = SILENT; }
      Eng.paint(ctx, W, H, token, { t: t, beat: audio.beat, nowMs: now, spectrum: spec });
      requestAnimationFrame(frame);
    })();
  });
})();</script>
<script>
/* Service de rendu pour la galerie : voir scripts/kids/make-render-page.mjs */
(function () {
  var E = window.HoodlrzEngine;
  var SILENT = new Array(32).fill(0);
  var cv = document.createElement('canvas');
  var ctx = cv.getContext('2d', { alpha: false });
  function render(hash, size) {
    cv.width = size; cv.height = size;
    var tk = E.createToken(hash);
    E.paint(ctx, size, size, tk, { t: 3, beat: 0, nowMs: 3000, spectrum: SILENT });
    return cv.toDataURL('image/webp', 0.9);
  }
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'hoodlrz:render' || typeof d.hash !== 'string') return;
    var src = e.source;
    __whenFontReady(function () {
      var out = null;
      try { out = render(d.hash, d.size || 512); } catch (err) {}
      try { src.postMessage({ type: 'hoodlrz:rendered', id: d.id, hash: d.hash, dataUrl: out }, '*'); } catch (err) {}
    });
  });
  try { parent.postMessage({ type: 'hoodlrz:ready' }, '*'); } catch (err) {}
})();
</script>
